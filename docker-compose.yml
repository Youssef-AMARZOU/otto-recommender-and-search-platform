services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_VERSION: ${MODEL_VERSION:-local}
      PROCESSED_DIR: /app/data/processed
      MODEL_PATH: /app/models/ranker.txt
      TWO_TOWER_DIR: /app/models/two_tower
    volumes:
      - ./data/processed:/app/data/processed
      - ./models:/app/models
    depends_on:
      - redis
      - mlflow

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  postgres:
    image: postgres:15
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    profiles: ["orchestration"]
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      PYTHONPATH: /app/src
    command: airflow db migrate
    volumes:
      - ./:/app
    depends_on:
      - postgres

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    profiles: ["orchestration"]
    environment: *airflow-env
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    depends_on:
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    profiles: ["orchestration"]
    environment: *airflow-env
    command: airflow scheduler
    volumes:
      - ./:/app
    depends_on:
      - airflow-init

volumes:
  mlflow-data:
  airflow-db:
